<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Root &amp; Rise</title>

  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <style>
    html { overscroll-behavior-y:contain; }
    .rr-ptr { position:fixed; top:calc(10px + env(safe-area-inset-top)); left:50%; transform:translateX(-50%); z-index:100; padding:12px 18px; border:1px solid #bba78388; border-radius:18px; color:#f4e6ce; background:#1c3026f5; box-shadow:0 6px 24px #0007; text-align:center; font:14px/1.4 Georgia,serif; pointer-events:none; }
    .rr-ptr[hidden] { display:none; }
    .rr-refresh-button { display:block; margin:20px auto; min-height:44px; padding:10px 18px; border:1px solid #bba78366; border-radius:14px; color:#eadbc2; background:#21372a; font:14px Georgia,serif; cursor:pointer; }
    .rr-refresh-button:focus-visible { outline:3px solid #e5c798; outline-offset:4px; }
  </style>
  <script>
    // Fresh URLs for the stylesheet and app code on every visit, including PTR.
    document.documentElement.dataset.rrAssetVersion = String(Date.now());
    const rrStyle = document.createElement("link");
    rrStyle.rel = "stylesheet";
    rrStyle.href = "./styles.css?v=" + document.documentElement.dataset.rrAssetVersion;
    document.head.appendChild(rrStyle);
  </script>
  <noscript><link rel="stylesheet" href="./styles.css?v=20261004-ptr1"></noscript>
</head>

<body>
  <main class="rr-shell" aria-label="Root & Rise">
    <header class="rr-header">
      <h1 class="rr-title">Root &amp; Rise</h1>
      <p class="rr-sub">Tend what grows. Tend yourself.</p>
    </header>

    <section class="rr-section" aria-label="Plants">
      <h2 class="rr-section-title">Plants</h2>
      <div class="rr-tiles-grid" id="rrTiles" aria-label="Plant tiles"></div>
    </section>

    <section class="rr-section" aria-label="Root &amp; Rise">
      <h2 class="rr-section-title">Root &amp; Rise</h2>

      <div class="rr-card-wrap">
        <img class="rr-card-img" src="./root-rise-card.png" alt="" loading="lazy" />
        <div class="rr-card-glass" id="rrAffirmation" aria-live="polite"></div>
      </div>

      <div class="rr-grounding" id="rrGrounding" aria-live="polite"></div>
    </section>

    <section class="rr-section" aria-label="Cared for">
      <h2 class="rr-section-title">Cared For</h2>
      <div class="rr-cared-list" id="rrCaredList" aria-label="Cared for history"></div>
    </section>
  </main>

  <!-- MODAL -->
  <div class="rr-modal-backdrop" id="rrModalBackdrop" hidden>
    <div class="rr-modal" role="dialog" aria-modal="true" aria-label="Plant details">
      <button class="rr-modal-close" type="button" id="rrModalClose" aria-label="Close">✕</button>

      <div class="rr-modal-body">
        <div class="rr-modal-top">
          <div class="rr-modal-thumb" id="rrModalThumb" aria-hidden="true"></div>
          <div class="rr-modal-head">
            <h3 class="rr-modal-title" id="rrModalTitle"></h3>
            <div class="rr-modal-sub" id="rrModalSub"></div>
          </div>
        </div>

        <div class="rr-modal-grid" id="rrModalGrid"></div>

        <div class="rr-modal-actions">
          <button class="rr-btn rr-btn-primary" type="button" id="rrMarkCaredBtn">Mark Cared For</button>
          <button class="rr-btn rr-btn-ghost" type="button" id="rrModalClose2">Close</button>
        </div>
      </div>
    </div>
  </div>
<p class="footer-sub">
Website by <a href="https://blackstagweb.com" rel="noopener noreferrer">Black Stag Web Studio</a>
</p>
<p>
    Textures by
    <a href="https://laceLeatherarcane.com" target="_blank" rel="noopener">
      Lace &amp; Leather
    </a>
  </p>
  <div class="rr-ptr" id="rrPullRefresh" role="status" aria-live="polite" hidden></div>
  <button class="rr-refresh-button" id="rrBackupButton" type="button">Download garden backup</button>
  <p>Keep a copy of your care dates and tending ledger. Your garden doesn’t transfer automatically between devices.</p>
  <button class="rr-refresh-button" id="rrRefreshButton" type="button">↻ Refresh garden</button>
  <script>
    (() => {
      "use strict";
      const script = document.createElement("script");
      script.src = "./app.js?v=" + document.documentElement.dataset.rrAssetVersion;
      document.body.appendChild(script);

      const notice = document.getElementById("rrPullRefresh");
      const button = document.getElementById("rrRefreshButton");
      let gesture = null, pulling = false, armed = false, refreshing = false, hideTimer;
      const atTop = () => (window.scrollY || document.documentElement.scrollTop || document.body.scrollTop || 0) <= 1;
      const modalOpen = () => document.body.classList.contains("rr-modal-open");
      const show = message => { clearTimeout(hideTimer); notice.textContent = message; notice.hidden = false; };
      function reset() {
        gesture = null; pulling = false; armed = false;
        if (!refreshing) notice.hidden = true;
      }
      function refreshGarden() {
        if (refreshing || modalOpen()) return;
        if (!navigator.onLine) {
          reset(); show("You’re offline. Reconnect to refresh your garden.");
          hideTimer = setTimeout(() => { notice.hidden = true; }, 3000);
          return;
        }
        refreshing = true; button.disabled = true; show("Refreshing your garden…");
        // Cache-bust the page as well; local care dates and history stay untouched.
        const url = new URL(window.location.href);
        url.searchParams.set("_rrRefresh", String(Date.now()));
        window.location.replace(url.href);
      }
      button.addEventListener("click", refreshGarden);
      document.getElementById("rrBackupButton").addEventListener("click", () => {
        if (refreshing) return;
        let link = null, url = null;
        try {
          const stateText = localStorage.getItem("rr.plantState.v4");
          const logText = localStorage.getItem("rr.caredLog.v4");
          const plantState = stateText === null ? {} : JSON.parse(stateText);
          const caredLog = logText === null ? [] : JSON.parse(logText);
          if (!plantState || typeof plantState !== "object" || Array.isArray(plantState) || !Array.isArray(caredLog)) {
            throw new Error("Unreadable garden records");
          }
          const now = new Date();
          const date = [now.getFullYear(), String(now.getMonth() + 1).padStart(2, "0"), String(now.getDate()).padStart(2, "0")].join("-");
          const backup = { app:"root-rise", version:1, exportedAt:now.toISOString(), plantState, caredLog };
          const blob = new Blob([JSON.stringify(backup, null, 2)], { type:"application/json" });
          url = URL.createObjectURL(blob);
          link = document.createElement("a");
          link.href = url;
          link.download = "root-rise-garden-" + date + ".json";
          document.body.appendChild(link);
          link.click();
          show("Garden backup prepared. Save the file somewhere safe.");
        } catch {
          show("Your garden backup could not be prepared. Your care records are unchanged.");
        } finally {
          if (link) link.remove();
          if (url) setTimeout(() => URL.revokeObjectURL(url), 60000);
          hideTimer = setTimeout(() => { if (!refreshing) notice.hidden = true; }, 6000);
        }
      });
      document.addEventListener("touchstart", event => {
        reset();
        if (refreshing || event.touches.length !== 1 || !atTop() || modalOpen() ||
          event.target.closest("input, textarea, select, [contenteditable]")) return;
        gesture = { x:event.touches[0].clientX, y:event.touches[0].clientY };
      }, { passive:true });
      document.addEventListener("touchmove", event => {
        if (!gesture || refreshing) return;
        if (event.touches.length !== 1 || modalOpen()) { reset(); return; }
        const dx = event.touches[0].clientX - gesture.x;
        const dy = event.touches[0].clientY - gesture.y;
        if (!pulling && (dy < -6 || Math.abs(dx) > Math.max(12, dy))) { reset(); return; }
        if (!pulling && dy < 12) return;
        if (!atTop() || !event.cancelable) { reset(); return; }
        event.preventDefault();
        pulling = true; armed = dy >= 100;
        show(armed ? "Release to refresh ✧" : "Pull down to refresh");
      }, { passive:false });
      document.addEventListener("touchend", event => {
        if (event.touches.length) { reset(); return; }
        const shouldRefresh = pulling && armed;
        reset(); if (shouldRefresh) refreshGarden();
      }, { passive:true });
      document.addEventListener("touchcancel", reset, { passive:true });
      window.addEventListener("pagehide", reset);
      window.addEventListener("pageshow", () => {
        refreshing = false; button.disabled = false; reset();
      });
    })();
  </script>
</body>
</html>
